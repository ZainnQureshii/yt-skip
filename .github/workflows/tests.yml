name: tests

# Contributor code runs here, so the token is read only and no secrets are exposed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install step. The tests have no dependencies and run on bare node.
      - run: node test/mute-state.test.js
      - run: node test/click-selection.test.js
      - run: node test/rate-control.test.js
